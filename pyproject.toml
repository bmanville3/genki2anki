[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genki2anki"
version = "0.2.0"
description = "Local pipeline: scanned Genki textbook PDF + audio -> vocab and grammar CSVs with page images, Jisho verification and audio"
requires-python = ">=3.10"
dependencies = [
  "pymupdf",
  "numpy",
  "requests",
  "pyyaml",
  "pykakasi",
]

[project.optional-dependencies]
asr = ["faster-whisper"]
fugashi = ["fugashi", "unidic-lite"]   # optional, more accurate readings than pykakasi
screenshots = ["playwright"]   # then: playwright install chromium
dev = ["pytest"]

[project.scripts]
genki2anki = "genki2anki.cli:main"

[tool.setuptools.packages.find]
include = ["genki2anki*"]
